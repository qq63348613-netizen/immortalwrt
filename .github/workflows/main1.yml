name: Build-ImmortalWrt-AQC113

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Clone ImmortalWrt (官方源码)
        run: |
          git clone https://github.com/immortalwrt/immortalwrt openwrt
          cd openwrt
          git checkout master   # ⚠️ 用官方默认分支（和官方构建一致）

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load official default config
        run: |
          cd openwrt
          make defconfig   # ✅ 官方默认配置（关键）

      - name: Append AQC113 modules（只追加，不修改）
        run: |
          cd openwrt
          echo "CONFIG_PACKAGE_kmod-atlantic=m" >> .config
          echo "CONFIG_PACKAGE_linux-firmware-aquantia=m" >> .config
          echo "CONFIG_PACKAGE_ethtool=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-ethtool=m" >> .config

          make defconfig   # 再整理依赖

      - name: Build
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: openwrt/bin/
