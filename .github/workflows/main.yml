name: AQC113C_Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Space cleanup
        run: |
          sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d/* /usr/local/lib/android
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Clone source
        run: |
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt -b openwrt-24.10 openwrt
          cd openwrt
          # 锁定 24.10.5 版本
          git fetch --tags
          git checkout v24.10.5

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate Config
        run: |
          cd openwrt
          # 强制写入 x86_64 基础配置并添加 AQC113 驱动
          curl -fsSL https://raw.githubusercontent.com/immortalwrt/immortalwrt/v24.10.5/config/x86/64 > .config
          echo "CONFIG_PACKAGE_kmod-atlantic=y" >> .config
          echo "CONFIG_PACKAGE_linux-firmware-aquantia=y" >> .config
          echo "CONFIG_PACKAGE_ethtool=y" >> .config
          make defconfig

      - name: Download
        run: |
          cd openwrt
          make download -j8

      - name: Compile
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Firmware_AQC113C
          path: openwrt/bin/targets/x86/64/*
