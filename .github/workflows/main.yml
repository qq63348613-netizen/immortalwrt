name: Build ImmortalWrt AQC113 IPK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1️⃣ Checkout（空操作，只占位）
      - name: Checkout
        run: echo "No repository needed, using SDK"

      # 2️⃣ 安装依赖
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-setuptools rsync swig unzip zlib1g-dev file wget xz-utils

      # 3️⃣ 下载 ImmortalWrt SDK
      - name: Download ImmortalWrt SDK
        run: |
          wget https://github.com/immortalwrt/immortalwrt/releases/download/24.10.5/ImmortalWrt-SDK-24.10.5-x86_64.tar.xz
          tar -xJf ImmortalWrt-SDK-24.10.5-x86_64.tar.xz
          cd ImmortalWrt-SDK-24.10.5-x86_64

      # 4️⃣ 更新 feeds
      - name: Update feeds
        run: |
          cd ImmortalWrt-SDK-24.10.5-x86_64
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 5️⃣ 使用官方默认配置
      - name: Load official default config
        run: |
          cd ImmortalWrt-SDK-24.10.5-x86_64
          make defconfig

      # 6️⃣ 添加 AQC113 驱动和工具
      - name: Add AQC113 modules
        run: |
          cd ImmortalWrt-SDK-24.10.5-x86_64
          echo "CONFIG_PACKAGE_kmod-atlantic=m" >> .config
          echo "CONFIG_PACKAGE_linux-firmware-aquantia=m" >> .config
          echo "CONFIG_PACKAGE_ethtool=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-ethtool=m" >> .config
          make defconfig

      # 7️⃣ 编译
      - name: Compile IPK
        run: |
          cd ImmortalWrt-SDK-24.10.5-x86_64
          make package/kmod-atlantic/compile V=s
          make package/linux-firmware-aquantia/compile V=s
          make package/ethtool/compile V=s
          make package/luci-app-ethtool/compile V=s

      # 8️⃣ 上传生成的 IPK
      - name: Upload IPK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-AQC113-IPK
          path: |
            ImmortalWrt-SDK-24.10.5-x86_64/bin/packages/x86_64/base/kmod-atlantic_*.ipk
            ImmortalWrt-SDK-24.10.5-x86_64/bin/packages/x86_64/base/linux-firmware-aquantia_*.ipk
            ImmortalWrt-SDK-24.10.5-x86_64/bin/packages/x86_64/base/ethtool_*.ipk
            ImmortalWrt-SDK-24.10.5-x86_64/bin/packages/x86_64/base/luci-app-ethtool_*.ipk
