name: Build_Standard_AQC113C_v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization Environment
        run: |
          sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d/* /usr/local/lib/android
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Clone source
        run: |
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt -b openwrt-24.10 openwrt
          cd openwrt
          git fetch --tags
          git checkout v24.10.5

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate Standard Full Config
        run: |
          cd openwrt
          # --- 核心改进：通过脚本生成官方标准架构配置 ---
          # 1. 设置 x86_64 目标
          echo "CONFIG_TARGET_x86=y" > .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config
          
          # 2. 强制开启 LuCI (网页界面) 和 中文语言包（这就是官方标准版的核心）
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
          
          # 3. 注入 AQC113C 驱动与固件
          echo "CONFIG_PACKAGE_kmod-atlantic=y" >> .config
          echo "CONFIG_PACKAGE_linux-firmware-aquantia=y" >> .config
          
          # 4. 加入常用的官方标准版组件 (磁盘、网络工具)
          echo "CONFIG_PACKAGE_ethtool=y" >> .config
          echo "CONFIG_PACKAGE_pciutils=y" >> .config
          echo "CONFIG_PACKAGE_fdisk=y" >> .config
          
          # 5. 执行 defconfig，系统会自动按照标准版逻辑补齐成百上千个依赖
          make defconfig

      - name: Download
        run: |
          cd openwrt
          make download -j16

      - name: Compile
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt_Standard_AQC113C
          path: openwrt/bin/targets/x86/64/*
