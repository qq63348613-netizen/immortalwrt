name: Build AQC113 IPK (ImmortalWrt 24.10.5)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Clone ImmortalWrt (指定版本)
        run: |
          git clone https://github.com/immortalwrt/immortalwrt openwrt
          cd openwrt
          git checkout 7c4e882aaf6f   # ✅ 精确匹配你的固件版本

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load config（关键）
        run: |
          cd openwrt
          make defconfig

      - name: Enable AQC113
        run: |
          cd openwrt
          echo "CONFIG_PACKAGE_kmod-atlantic=m" >> .config
          echo "CONFIG_PACKAGE_linux-firmware-aquantia=m" >> .config
          echo "CONFIG_PACKAGE_ethtool=m" >> .config
          make defconfig

      - name: Compile kmod only
        run: |
          cd openwrt
          make package/kmod-atlantic/compile V=s
          make package/linux-firmware-aquantia/compile V=s
          make package/ethtool/compile V=s

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: aqc113-ipk
          path: openwrt/bin/packages/x86_64/base/*.ipk
