name: Build_AQC113C_Driver_Only

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization Environment
        run: |
          sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d/* /usr/local/lib/android
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Clone source
        run: |
          # 必须使用 v24.10.5 源码以确保内核版本与官方固件尽可能接近
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt -b openwrt-24.10 openwrt
          cd openwrt
          git fetch --tags
          git checkout v24.10.5

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate Driver Config
        run: |
          cd openwrt
          # 使用官方 x86_64 模板
          curl -fsSL https://raw.githubusercontent.com/immortalwrt/immortalwrt/v24.10.5/config/x86/64 > .config
          
          # 仅选中 AQC113C 核心驱动及固件，设为模块 (m)
          echo "CONFIG_PACKAGE_kmod-atlantic=m" >> .config
          echo "CONFIG_PACKAGE_linux-firmware-aquantia=m" >> .config
          
          # 选中网卡管理工具 (m)
          echo "CONFIG_PACKAGE_ethtool=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-ethtool=m" >> .config
          
          # 补齐依赖
          make defconfig

      - name: Download
        run: |
          cd openwrt
          make download -j16

      - name: Compile
        run: |
          cd openwrt
          # 仅编译驱动模块
          make -j$(nproc) || make -j1 V=s

      - name: Upload Drivers
        uses: actions/upload-artifact@v4
        with:
          name: AQC113C_IPK_Package
          # 提取编译出的驱动和固件包
          path: |
            openwrt/bin/targets/x86/64/kmods/*/kmod-atlantic*.ipk
            openwrt/bin/packages/x86_64/base/linux-firmware-aquantia*.ipk
            openwrt/bin/packages/x86_64/base/ethtool*.ipk
            openwrt/bin/packages/x86_64/luci/luci-app-ethtool*.ipk
