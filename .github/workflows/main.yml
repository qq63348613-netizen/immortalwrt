name: Build AQC113 IPK (ImmortalWrt 24.10.5)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Clone ImmortalWrt
        run: |
          git clone https://github.com/immortalwrt/immortalwrt openwrt
          cd openwrt
          # 切换到 24.10.5 对应的 commit
          git checkout 7c4e882aaf6f

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure settings
        run: |
          cd openwrt
          # 生成默认配置
          make defconfig
          # 写入 AQC113 相关配置
          echo "CONFIG_PACKAGE_kmod-atlantic=m" >> .config
          echo "CONFIG_PACKAGE_linux-firmware-aquantia=m" >> .config
          echo "CONFIG_PACKAGE_ethtool=m" >> .config
          # 再次执行使配置生效
          make defconfig

      - name: Compile kmod and tools
        run: |
          cd openwrt
          # 1. 必须先准备工具链和内核头文件
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)
          make target/linux/compile -j$(nproc) V=s
          
          # 2. 分别编译目标包 (内核驱动通常在 package/kernel/linux 下)
          make package/kernel/linux/compile V=s
          make package/feeds/base/ethtool/compile V=s
          # 固件包路径通常在 feeds/base 或 package/firmware
          make package/firmware/linux-firmware/compile V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aqc113-driver-pack
          # 使用通配符递归查找所有生成的 .ipk
          # kmod 在 bin/targets/，工具在 bin/packages/
          path: |
            openwrt/bin/targets/x86/64/packages/kmod-atlantic*.ipk
            openwrt/bin/packages/x86_64/base/ethtool*.ipk
            openwrt/bin/packages/x86_64/base/linux-firmware-aquantia*.ipk

