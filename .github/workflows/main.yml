name: AQC113C_Build_Fixed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Space cleanup
        run: |
          sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d/* /usr/local/lib/android
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Clone source
        run: |
          # 克隆 24.10 分支
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt -b openwrt-24.10 openwrt
          cd openwrt
          # 确保切换到 24.10.5 标签
          git fetch --tags
          git checkout v24.10.5

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate Config
        run: |
          cd openwrt
          # 步骤修正：不再通过 curl 下载远程 config，直接使用源码自带的生成命令
          # 设置目标为 x86_64
          echo "CONFIG_TARGET_x86=y" > .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config
          
          # 核心驱动注入
          echo "CONFIG_PACKAGE_kmod-atlantic=y" >> .config
          echo "CONFIG_PACKAGE_linux-firmware-aquantia=y" >> .config
          
          # 常用工具注入
          echo "CONFIG_PACKAGE_ethtool=y" >> .config
          echo "CONFIG_PACKAGE_pciutils=y" >> .config
          
          # 补全所有默认依赖
          make defconfig

      - name: Download
        run: |
          cd openwrt
          make download -j8

      - name: Compile
        run: |
          cd openwrt
          # 开启多线程编译
          make -j$(nproc) || make -j1 V=s

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt_24.10.5_AQC113C
          path: openwrt/bin/targets/x86/64/*
