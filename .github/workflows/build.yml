name: Build kmod-atlantic (fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Clone ImmortalWrt
      run: |
        git clone -b v24.10.5 https://github.com/immortalwrt/immortalwrt openwrt

    - name: Update Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configure
      run: |
        cd openwrt
        make defconfig
        echo "CONFIG_PACKAGE_kmod-atlantic=m" >> .config
        make defconfig

    - name: Build Kernel Modules
      run: |
        cd openwrt
        make target/linux/compile -j$(nproc) V=s

    - name: Upload ipk
      uses: actions/upload-artifact@v4
      with:
        name: kmod-atlantic
        path: openwrt/bin/targets/x86/64/packages/kmod-atlantic*.ipk
