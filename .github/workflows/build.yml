name: Build ImmortalWrt Official + AQC113 Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clone ImmortalWrt
      run: |
        git clone -b v24.10.5 https://github.com/immortalwrt/immortalwrt openwrt

    - name: Update Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Clean Previous Build
      run: |
        cd openwrt
        make distclean

    - name: Default Config + Add Driver
      run: |
        cd openwrt
        # 使用官方默认配置
        make defconfig

        # ===== 只加网卡驱动 =====
        echo "CONFIG_PACKAGE_kmod-atlantic=y" >> .config
        echo "CONFIG_PACKAGE_kmod-macsec=y" >> .config
        echo "CONFIG_PACKAGE_kmod-crypto-gcm=y" >> .config
        echo "CONFIG_PACKAGE_ethtool=y" >> .config
        echo "CONFIG_PACKAGE_pciutils=y" >> .config

        make defconfig

    - name: Build Firmware
      run: |
        cd openwrt
        # -j1 + V=s 保证日志完整，方便调试
        make -j1 V=s

    - name: Upload Firmware
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt-x86-64-official-driver
        path: openwrt/bin/targets/x86/64/
