name: Build ImmortalWrt Lite (24.10.5)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clone ImmortalWrt
      run: |
        git clone -b v24.10.5 https://github.com/immortalwrt/immortalwrt openwrt

    - name: Update Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Custom Config
      run: |
        cd openwrt

        # ===== 禁用 Rust（关键）=====
        echo "CONFIG_PACKAGE_rust=n" >> .config
        echo "CONFIG_PACKAGE_cargo=n" >> .config

        # ===== 网卡驱动 =====
        echo "CONFIG_PACKAGE_kmod-atlantic=y" >> .config
        echo "CONFIG_PACKAGE_kmod-macsec=y" >> .config
        echo "CONFIG_PACKAGE_kmod-crypto-gcm=y" >> .config
        echo "CONFIG_PACKAGE_ethtool=y" >> .config
        echo "CONFIG_PACKAGE_pciutils=y" >> .config

        # ===== AdGuardHome =====
        echo "CONFIG_PACKAGE_AdGuardHome=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-adguardhome=y" >> .config

        # ===== Docker =====
        echo "CONFIG_PACKAGE_docker=y" >> .config
        echo "CONFIG_PACKAGE_dockerd=y" >> .config
        echo "CONFIG_PACKAGE_docker-compose=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-dockerman=y" >> .config

        # ===== LuCI 基础 =====
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config

        # ===== 性能优化 =====
        echo "CONFIG_PACKAGE_irqbalance=y" >> .config

        make defconfig

    - name: Download
      run: |
        cd openwrt
        make download -j8

    - name: Build
      run: |
        cd openwrt
        make -j$(nproc)

    - name: Upload Firmware
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt-x86-64-lite
        path: openwrt/bin/targets/x86/64/
