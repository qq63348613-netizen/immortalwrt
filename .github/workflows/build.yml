name: Build ImmortalWrt Full

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clone source
      run: |
        git clone https://github.com/immortalwrt/immortalwrt
        mv immortalwrt openwrt

    - name: Prepare
      run: |
        cd openwrt
        chmod +x ../scripts/custom.sh
        ../scripts/custom.sh

    - name: Download deps
      run: |
        cd openwrt
        make download -j8

    - name: Build
      run: |
        cd openwrt
        make -j$(nproc)
