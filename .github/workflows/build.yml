name: Build ImmortalWrt 24.10.5 with AQC113C

on:
  workflow_dispatch: # 手动触发

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo timedatectl set-timezone "$TZ"

    - name: Clone source code
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        # 强制切换到 24.10.5 标签（如果是特定的稳定版）
        git checkout v24.10.5 

    - name: Update & Install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Custom Configuration (AQC113C Drive)
      run: |
        cd openwrt
        # 使用默认 x86_64 配置作为基础（如果是其他架构请修改）
        curl -fsSL https://raw.githubusercontent.com/immortalwrt/immortalwrt/openwrt-24.10/config/x86/64 > .config
        
        # --- 注入 AQC113C 驱动核心配置 ---
        echo "CONFIG_PACKAGE_kmod-atlantic=y" >> .config
        echo "CONFIG_PACKAGE_linux-firmware-aquantia=y" >> .config
        
        # 补全依赖并生成最终配置
        make defconfig

    - name: Download package
      run: |
        cd openwrt
        make download -j8

    - name: Compile the firmware
      run: |
        cd openwrt
        # 24.10.5 首次编译建议先单线程，或多线程报错后切回单线程查看具体原因
        make -j$(nproc) || make -j1 V=s

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt_24.10.5_AQC113C
        path: openwrt/bin/targets/*/*/*
