name: Build kmod-atlantic for ImmortalWrt Official

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clone ImmortalWrt
      run: |
        git clone -b v24.10.5 https://github.com/immortalwrt/immortalwrt openwrt

    - name: Update Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Clean Previous Build
      run: |
        cd openwrt
        make distclean

    - name: Configure Only Atlantic Driver
      run: |
        cd openwrt
        # 加载官方默认配置（全家桶原版不动）
        make defconfig

        # 只加网卡驱动
        echo "CONFIG_PACKAGE_kmod-atlantic=y" >> .config

        make defconfig

    - name: Build kmod-atlantic Package
      run: |
        cd openwrt
        make package/kernel/atlantic/compile V=s

    - name: Upload kmod-atlantic .ipk
      uses: actions/upload-artifact@v4
      with:
        name: kmod-atlantic
        path: openwrt/bin/packages/x86_64/kmod-atlantic*.ipk
