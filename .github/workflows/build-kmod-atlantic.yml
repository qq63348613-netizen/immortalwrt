name: Build kmod-atlantic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # 强制 Node.js 24

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up cache
      uses: actions/cache@v3
      with:
        path: |
          staging_dir/host
          staging_dir/toolchain-*
          dl
        key: ${{ runner.os }}-immortalwrt-${{ hashFiles('.config') }}
        restore-keys: |
          ${{ runner.os }}-immortalwrt-

    - name: Update feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configure kernel module
      run: |
        # 确保 kmod-atlantic 启用 (M)
        echo "CONFIG_PACKAGE_kmod-atlantic=m" >> .config
        make defconfig

    - name: Compile kmod-atlantic
      run: |
        make package/kmod-atlantic/compile V=s
        make package/kmod-atlantic/install V=s

    - name: Upload kmod-atlantic.ipk
      uses: actions/upload-artifact@v4
      with:
        name: kmod-atlantic-ipk
        path: bin/packages/x86_64/kmod-atlantic*.ipk
