name: Build ImmortalWrt 24.10.5 (AQC113C Enhanced)

on:
  workflow_dispatch: # 手动点击 Actions 运行

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  TAG_VERSION: v24.10.5
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$USER /workdir

    - name: Clone Source Code
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        # 强制锁定到 24.10.5 稳定版本标签
        git checkout $TAG_VERSION
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Update & Install Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Inject AQC113C Configuration
      run: |
        cd openwrt
        # 1. 自动根据 x86_64 默认模板生成初始配置
        curl -fsSL https://raw.githubusercontent.com/immortalwrt/immortalwrt/$TAG_VERSION/config/x86/64 > .config
        
        # 2. 注入 Marvell / Aquantia AQC113C 驱动核心组件
        echo "CONFIG_PACKAGE_kmod-atlantic=y" >> .config
        echo "CONFIG_PACKAGE_linux-firmware-aquantia=y" >> .config
        
        # 3. 辅助诊断工具（建议开启，方便后期排查）
        echo "CONFIG_PACKAGE_ethtool=y" >> .config
        echo "CONFIG_PACKAGE_pciutils=y" >> .config
        
        # 4. 解决 24.10.5 常见的依赖，确保生成完整配置
        make defconfig

    - name: Download DL Packages
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        # 24.10.5 在 6.6 内核上编译非常耗时，首次建议使用全部核心
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Organize Files
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/x86/64
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: Upload Firmware
      uses: actions/upload-artifact@v4
      if: env.FIRMWARE
      with:
        name: ImmortalWrt_v24.10.5_AQC113C
        path: ${{ env.FIRMWARE }}/*
