name: Build kmod-atlantic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ImmortalWrt source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk flex bison git unzip python3 python3-setuptools python3-dev swig

      - name: Prepare atlantic package
        run: |
          # 创建 package/kernel/atlantic
          mkdir -p package/kernel/atlantic
          cat > package/kernel/atlantic/Makefile << 'EOF'
include $(TOPDIR)/rules.mk
PKG_NAME:=kmod-atlantic
PKG_VERSION:=6.6.122
PKG_RELEASE:=1

include $(INCLUDE_DIR)/kernel.mk
include $(INCLUDE_DIR)/package.mk

define KernelPackage/kmod-atlantic
  SUBMENU:=Network Drivers
  TITLE:=Aquantia Atlantic Ethernet driver
  FILES:=$(PKG_BUILD_DIR)/drivers/net/ethernet/aquantia/atlantic/atlantic.ko
  AUTOLOAD:=$(call AutoLoad,50,kmod-atlantic)
endef

$(eval $(call KernelPackage,kmod-atlantic))
EOF

      - name: Enable atlantic driver in config
        run: |
          echo "CONFIG_NET_VENDOR_AQUANTIA=y" >> .config
          echo "CONFIG_ATLANTIC=m" >> .config
          echo "CONFIG_MACSEC=m" >> .config
          make defconfig

      - name: Compile kmod-atlantic
        run: |
          make package/kernel/atlantic/compile V=s

      - name: Upload kmod-atlantic ipk
        uses: actions/upload-artifact@v4
        with:
          name: kmod-atlantic-ipk
          path: bin/packages/**/kmod-atlantic*.ipk
